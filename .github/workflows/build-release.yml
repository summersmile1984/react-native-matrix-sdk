name: Build (Release)
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main commit's versioned native SDK release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-release:
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require main for publication
        if: inputs.publish
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install JS build dependencies without consuming a previous release
        run: node .yarn/releases/yarn-3.6.1.cjs install --immutable --mode=skip-build
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned native toolchains
        run: |
          sdkmanager 'ndk;26.1.10909125'
          rustup toolchain install 1.93.0 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          rustup override set 1.93.0
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Verify binary archive rejection cases
        run: node --test scripts/__tests__/binary-artifacts.test.js
      - name: Build and package matching Android and iOS libraries
        run: node scripts/build-native-release.js
      - name: Record source and checksum evidence
        run: |
          {
            echo '### Native SDK release provenance'
            echo '```json'
            cat native-release-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable versioned native archive
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-native-release.js
